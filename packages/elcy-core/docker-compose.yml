version: '3'
services:
  # mysql
  mysql:
    image: "mysql:5.7.10"
    container_name: "elcy-mysql"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
      MYSQL_DATABASE: "database"

  # mariadb
  mariadb:
    image: "mariadb:10.1.16"
    container_name: "elcy-mariadb"
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
      MYSQL_DATABASE: "database"

  # postgres
  postgres:
    image: "mdillon/postgis:9.6"
    container_name: "elcy-postgres"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "database"

  # mssql
  mssql:
    image: "microsoft/mssql-server-linux:2017-GA"
    container_name: "elcy-mssql"
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "sa"
      ACCEPT_EULA: "Y"

  # mongodb
  mongodb:
    image: "mongo:3.4.1"
    container_name: "elcy-mongodb"
    ports:
      - "27017:27017"

  # redis
  redis:
    image: "redis:3.0.3"
    container_name: "elcy-redis"
    ports:
      - "6379:6379"